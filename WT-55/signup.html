<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCademy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#B2C8BA]">
    <div class="bg-[#D2E3C8] w-150 h-150 rounded-xl shadow-lg">
        <div class="flex items-center justify-center mt-4 text-gray-700">
        <h2 class="font-bold text-xl mt-6">Sign Up Here</h2>
    </div>
        <form class="flex items-center justify-center">
            <div class="flex-col items-center justify-center"><br>
                <label>First Name :</label><br>
                <input class="text-gray-800 rounded-md border w-90 h-10 p-2 mb-2" type="text" placeholder="Enter your firstname"><br>
                <label>Last Name : </label><br>
                <input class="text-gray-800 rounded-md border w-90 h-10 p-2 mb-2" type="text" placeholder="Enter your lastname"><br>
                <label>Password :</label><br>
                <input class="text-gray-800 rounded-md border w-90 h-10 p-2 mb-2" type="password" placeholder="Create password"><br>
                <label>Current Password :</label><br>
                <input class="text-gray-800 rounded-md border w-90 h-10 p-2 mb-2" type="password" placeholder="Enter your current password"><br><br><br>
                <div class="flex items-center justify-center">
                <button class="w-90 h-10 border rounded-3xl flex items-center justify-center bg-[#86A789] text-gray-100 font-bold" type="submit">Sign Up</button>
            </div>
            </div>
        </form>
    </div>
</body>
</html>
