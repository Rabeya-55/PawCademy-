<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCademy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#EBF3E8]">
    <div class="bg-[#abbfb5] w-100 h-100 rounded-xl shadow-lg">
        <div class="flex items-center justify-center mt-4 text-gray-700">
        <h2 class="font-bold text-xl mt-4 ">Sign In Here</h2>
    </div>
        <form>
            <div class="flex-col items-center justify-center"><br>
                <label class="p-4">Username :</label>
                <input class="text-gray-800 rounded-md border w-60 h-10 p-2 mt-2" type="text" placeholder="Enter your username"><br><br>
                <label class="p-4">Password : </label>
                <input class="text-gray-800 rounded-md border w-60 h-10 p-2" type="password" placeholder="Enter your password">
                <p class="p-4">Forgot your password? <a href="signup.html">Register here </a></p><br>
                <div class="flex items-center justify-center">
                <button class="w-80 h-10 border rounded-3xl flex items-center justify-center bg-[#7895a5] text-gray-100 " type="submit">Sign in</button>
            </div>
            </div>
        </form>
    </div>
</body>
</html>
